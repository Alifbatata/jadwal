# La configuration d'Ansible pour jadwal (ADR 0034).
#
# Rien d'exotique ici. Deux choix méritent d'être dits :
#
#   `become = false` par défaut — les rôles déclarent `become` tâche par tâche. Sur un serveur qui
#   peut héberger d'autres applications, un playbook qui passe root partout est un playbook dont on
#   ne sait plus ce qu'il touche.
#
#   `any_errors_fatal = true` — une erreur arrête tout, immédiatement. Un déploiement à moitié fait
#   est plus difficile à défaire qu'un déploiement qui n'a pas commencé.
#
# `inventory.ini` décrit une machine précise et n'est donc pas dans le dépôt. Son original vit dans
# `PRIVE/inventaire/inventory.ini`, hors de portée de git ; ce qui porte ce nom-ci est la copie que
# le déploiement pose, puis efface. Le créer en copiant `inventory.ini.example` — voir
# `infra/README.md`.
[defaults]
inventory = inventory.ini
roles_path = roles
host_key_checking = true
# Une sortie YAML plutôt qu'une ligne par tâche : c'est ce qui rend un `--check --diff` lisible, et
# un diff qu'on ne lit pas ne sert à rien. Le rappel `yaml` de `community.general` a été **retiré**
# de la collection, et le rappel du même nom n'existe plus dans ansible-core : depuis 2.13, c'est
# une option du rappel par défaut. Écrit ainsi, cela ne demande aucune collection.
stdout_callback = default
# `callback_result_format`, et non `result_format` : la clé courte n'est lue par aucune version
# d'ansible-core (relevé par `ansible-config` en 2.21.4), et la sortie restait en JSON.
callback_result_format = yaml
display_skipped_hosts = false
any_errors_fatal = true
interpreter_python = auto_silent
vault_password_file = ~/.jadwal-secrets/vault-pass.txt

[ssh_connection]
pipelining = true
# **Une seule connexion SSH pour tout le playbook**, réutilisée par chaque tâche.
#
# Sans cela, Ansible en ouvre une par tâche : une soixantaine en deux minutes. Un serveur qui
# surveille ses tentatives de connexion — `fail2ban`, ou simplement `MaxStartups` de sshd — voit
# arriver une rafale et coupe. C'est ce qui est arrivé au premier `--check --diff` de l'étape 9 :
# le playbook a déroulé dix-sept tâches, puis « Connection refused » jusqu'à la fin.
#
# Le déploiement réel aurait échoué de la même façon, à mi-chemin, ce qui est le pire moment.
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey
control_path_dir = ~/.ansible/cp
