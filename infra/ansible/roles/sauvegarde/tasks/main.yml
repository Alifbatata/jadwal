# Les sauvegardes : la clé publique, la destination, les verrous, et de quoi les prouver
# (ADR 0035, ADR 0037).
---
- name: Une clé publique age et une destination sont indispensables
  ansible.builtin.assert:
    that:
      - jadwal_age_recipient | length > 0
      - jadwal_age_recipient.startswith('age1')
      - jadwal_rclone_remote | length > 0
    fail_msg: >-
      jadwal_age_recipient (clé PUBLIQUE age de l'exploitant) et jadwal_rclone_remote
      (destination hors du serveur) sont tous les deux obligatoires. Sans eux, la tâche de
      sauvegarde refuse de tourner plutôt que d'écrire une archive en clair ou de la laisser sur
      place — et le playbook s'arrête ici pour la même raison.

# La configuration de rclone porte les identifiants de la destination. Même régime que le fichier
# d'environnement : root, 0600, et rien d'autre.
- name: La configuration de rclone
  ansible.builtin.copy:
    dest: '{{ jadwal_etc }}/rclone.conf'
    content: '{{ vault_rclone_conf }}'
    owner: root
    group: root
    mode: '0600'
  become: true
  no_log: true

- name: La destination répond et est accessible en écriture
  ansible.builtin.command: rclone --config {{ jadwal_etc }}/rclone.conf lsd {{ jadwal_rclone_remote }}
  register: destination
  changed_when: false
  become: true

- name: La clé privée n'est pas sur ce serveur, et on le vérifie
  ansible.builtin.find:
    paths: ['{{ jadwal_etc }}', '{{ jadwal_racine }}', '/root']
    patterns: ['*.age', '*age*key*', 'identity*']
    recurse: true
  register: cles
  become: true

- name: Aucun fichier de clé privée ne traîne
  ansible.builtin.assert:
    that: cles.files | length == 0
    fail_msg: >-
      Des fichiers qui ressemblent à une clé privée age ont été trouvés sur le serveur :
      {{ cles.files | map(attribute='path') | list }}. La clé de déchiffrement des sauvegardes ne
      doit jamais être ici : une archive volée chez l'hébergeur doit rester illisible, et une
      archive volée ici aussi.

# ------------------------------------------------------------------------------------------------
# Les verrous de conservation (ADR 0037)
#
# Tout le reste de ce rôle protège les archives d'un vol. Ce bloc-ci les protège d'un **effacement**,
# et c'est une autre menace : qui obtient root ici obtient le jeton de `rclone`, et un jeton qui sait
# effacer efface. La parade est chez le stockage — verrou de conservation par préfixe, plus un cycle
# de vie qui efface un jour après la fin du verrou — et elle ne se pose pas depuis ce serveur.
#
# Ce que ce rôle peut faire, et fait : **vérifier qu'elle est bien en place**, en essayant. Un objet
# d'essai est écrit sous `quotidien/`, puis on tente de l'écraser et de l'effacer ; les deux doivent
# échouer. L'objet reste ensuite jusqu'à la fin de son verrou — c'est le prix de la preuve, et il est
# de quelques kilo-octets.
#
# `jadwal_verifier_verrous=false` saute cette vérification. Ne l'utiliser que sur une destination qui
# n'a délibérément pas de verrou : un stockage qui n'en propose pas, ou une instance d'essai.
# ------------------------------------------------------------------------------------------------
#
# `not ansible_check_mode` : cette vérification **écrit** un objet, et un `--check` n'écrit rien. Sans
# cette condition, la première tâche est sautée, `sonde.stdout_lines` est vide, et la suivante échoue
# sur « No last item, sequence was empty » — un `--check --diff` qui s'arrête sur son propre garde-fou
# au lieu de montrer ce qu'il changerait. Trouvé en le lançant, pas en le relisant.
- name: Les verrous de conservation, éprouvés pour de vrai
  when:
    - jadwal_verifier_verrous | default(true)
    - not ansible_check_mode
  become: true
  block:
    - name: Un objet d'essai sous quotidien/
      ansible.builtin.shell: |
        set -euo pipefail
        sonde="$(mktemp)"
        date --utc +%Y-%m-%dT%H:%M:%SZ > "$sonde"
        nom="quotidien/verrou-eprouve-$(date --utc +%Y-%m-%dT%H%M%SZ).txt"
        rclone --config {{ jadwal_etc }}/rclone.conf copyto "$sonde" "{{ jadwal_rclone_remote }}/$nom"
        rm -f "$sonde"
        echo "$nom"
      register: sonde
      changed_when: true

    - name: L'écrasement doit être refusé
      ansible.builtin.shell: |
        set -uo pipefail
        autre="$(mktemp)"
        echo "un autre contenu" > "$autre"
        rclone --config {{ jadwal_etc }}/rclone.conf copyto "$autre" \
          "{{ jadwal_rclone_remote }}/{{ sonde.stdout_lines | last }}"
        code=$?
        rm -f "$autre"
        exit $code
      register: ecrasement
      failed_when: false
      changed_when: false

    - name: L'effacement doit être refusé
      ansible.builtin.command: >-
        rclone --config {{ jadwal_etc }}/rclone.conf deletefile
        {{ jadwal_rclone_remote }}/{{ sonde.stdout_lines | last }}
      register: effacement
      failed_when: false
      changed_when: false

    - name: Le verrou tient, dans les deux sens
      ansible.builtin.assert:
        that:
          - ecrasement.rc != 0
          - effacement.rc != 0
        success_msg: >-
          L'objet d'essai n'a pu être ni écrasé ni effacé avec le jeton de ce serveur : le verrou de
          conservation est en place. Il disparaîtra tout seul à la fin de sa rétention.
        fail_msg: >-
          Avec le jeton de ce serveur, l'objet d'essai a pu être
          {{ 'écrasé' if ecrasement.rc == 0 else '' }}{{ ' et ' if ecrasement.rc == 0 and effacement.rc == 0 else '' }}{{ 'effacé' if effacement.rc == 0 else '' }}.
          Les sauvegardes ne sont donc PAS à l'abri de qui prendrait ce serveur : le verrou de
          conservation n'est pas posé sur le préfixe quotidien/, ou le jeton a plus de droits que
          prévu. Poser les verrous avant de continuer (ADR 0037).
