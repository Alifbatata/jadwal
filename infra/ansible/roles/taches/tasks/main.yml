# Les tâches périodiques : scripts, unités, minuteries (ADR 0036).
#
# systemd plutôt que cron, et plutôt qu'un conteneur ordonnanceur. Les trois raisons, dans l'ordre
# où elles comptent : une minuterie sait rattraper une exécution manquée (`Persistent=true`), ce que
# cron ne sait pas ; un échec déclenche `OnFailure=`, c'est-à-dire un courriel, sans qu'aucun script
# n'ait à penser à le faire ; et le journal de chaque exécution est déjà là, daté, avec son code de
# sortie, sans fichier de log à faire tourner. Un conteneur ordonnanceur aurait ajouté un troisième
# conteneur à surveiller pour rendre ce que l'hôte fait déjà.
---
- name: Les scripts des tâches
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../scripts/{{ item }}'
    dest: '{{ jadwal_racine }}/scripts/{{ item }}'
    owner: root
    group: root
    mode: "{{ '0644' if item.endswith('.mjs') else '0755' }}"
  loop:
    - jadwal-commun.sh
    - jadwal-alerte.sh
    - jadwal-prieres.sh
    - jadwal-purges.sh
    - jadwal-sauvegarde.sh
    - jadwal-retention.sh
    - jadwal-restauration.sh
    - jadwal-veille.sh
    - jadwal-sonde.sh
    - jadwal-mail.mjs
  become: true

# Les deux règles des sauvegardes : où part une archive et sous quel nom, et lesquelles on garde
# sur le disque (ADR 0037). Elles vivent dans leur propre paquet, avec leurs tests, et sont jouées
# sur le serveur par un conteneur jetable tiré de l'image de l'application — l'hôte n'a pas de Node,
# et n'a pas à en avoir un.
- name: Les règles des sauvegardes
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../sauvegarde/{{ item.src }}'
    dest: '{{ jadwal_racine }}/scripts/{{ item.dest }}'
    owner: root
    group: root
    mode: '0644'
  loop:
    - { src: destinations.mjs, dest: jadwal-destinations.mjs }
    - { src: retention.mjs, dest: jadwal-retention.mjs }
  become: true

- name: Les unités systemd
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../systemd/{{ item }}'
    dest: '/etc/systemd/system/{{ item }}'
    owner: root
    group: root
    mode: '0644'
  loop:
    - jadwal-alerte@.service
    - jadwal-prieres.service
    - jadwal-prieres.timer
    - jadwal-purges.service
    - jadwal-purges.timer
    - jadwal-sauvegarde.service
    - jadwal-sauvegarde.timer
    - jadwal-restauration.service
    - jadwal-restauration.timer
    - jadwal-veille.service
    - jadwal-veille.timer
    - jadwal-sonde@.service
    - jadwal-sonde@.timer
  become: true
  register: unites

# `daemon-reload` relit les fichiers d'unités ; il ne redémarre rien. Aucun service existant n'est
# touché par cette commande.
- name: Relecture des unités par systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true
  when: unites.changed

# `not ansible_check_mode` : en mode vérification, les fichiers d'unités n'ont pas été écrits, et
# systemd refuse d'armer une minuterie qu'il ne connaît pas — « Could not find the requested
# service ». Le playbook s'arrêtait donc là, avant d'avoir montré les conteneurs, le bloc de site et
# les comptes, c'est-à-dire avant l'essentiel de ce qu'un `--check --diff` sert à relire.
- name: Les minuteries sont armées
  when: not ansible_check_mode
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    enabled: true
    state: started
  loop: >-
    {{ ['jadwal-prieres.timer', 'jadwal-purges.timer', 'jadwal-sauvegarde.timer',
        'jadwal-restauration.timer', 'jadwal-veille.timer', 'jadwal-sonde@4.timer']
       + (['jadwal-sonde@6.timer'] if jadwal_sonde_ipv6 else []) }}
  become: true

# Une instance sans IPv6 ne doit pas voir sa sonde IPv6 échouer toutes les cinq minutes pour une
# adresse qu'elle ne publie pas. Si elle a été armée puis que `jadwal_sonde_ipv6` repasse à faux, on
# la désarme : un réglage qui ne défait pas ce qu'il a fait n'est pas un réglage.
- name: La sonde IPv6 est désarmée quand l'instance n'en a pas
  ansible.builtin.systemd_service:
    name: 'jadwal-sonde@6.timer'
    enabled: false
    state: stopped
  when:
    - not jadwal_sonde_ipv6
    - not ansible_check_mode
  failed_when: false
  become: true

- name: Ce qui est programmé, pour le rapport
  ansible.builtin.command: systemctl list-timers --all --no-pager 'jadwal-*'
  register: minuteries
  changed_when: false
  become: true

- name: Les prochaines échéances
  ansible.builtin.debug:
    var: minuteries.stdout_lines
