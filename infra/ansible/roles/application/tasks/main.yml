# L'application et sa base : deux conteneurs, un réseau, un volume (ADR 0034).
---
- name: Une image, et par digest
  ansible.builtin.assert:
    that:
      - jadwal_image | length > 0
      - "'@sha256:' in jadwal_image"
    fail_msg: >-
      jadwal_image doit être une référence par digest (ghcr.io/…@sha256:…), jamais une étiquette.
      Une étiquette bouge : le retour arrière ne rendrait pas forcément ce qui tournait avant.
      Exemple : ansible-playbook jadwal.yml -e jadwal_image=ghcr.io/compte/jadwal@sha256:…

# Compose doit être assez récent pour lire un `env_file` en `format: raw`, faute de quoi il
# interpolerait les secrets et les tronquerait en silence — voir le fichier Compose. Une version
# trop ancienne **ignore** la clé `format` sans rien dire : sans cette vérification, le déploiement
# paraîtrait réussi et le service n'enverrait aucun courriel.
- name: La version de Docker Compose
  ansible.builtin.command: docker compose version --short
  register: compose_version
  changed_when: false
  check_mode: false
  become: true

- name: Compose sait lire un fichier d'environnement tel quel
  ansible.builtin.assert:
    that: compose_version.stdout | trim | replace('v', '') is version('2.30.0', '>=')
    fail_msg: >-
      Docker Compose {{ compose_version.stdout | trim }} ignore « format: raw » sur env_file, qui
      demande 2.30.0 ou plus. Sans lui, un secret portant un « $ » arriverait tronqué dans le
      conteneur, sans erreur. Mettre Compose à jour avant de déployer. Rien n'a été écrit.

- name: Le fichier Compose
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../compose/docker-compose.yml'
    dest: '{{ jadwal_racine }}/compose/docker-compose.yml'
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: relancer jadwal

# Le fichier d'environnement porte tous les secrets du service. 0600 root:root, et rien d'autre :
# c'est cette ligne qui rend jadwal illisible à tout compte non privilégié.
# `no_log` empêche Ansible d'en recopier le contenu dans sa propre sortie.
- name: Le fichier d'environnement
  ansible.builtin.template:
    src: jadwal.env.j2
    dest: '{{ jadwal_etc }}/jadwal.env'
    owner: root
    group: root
    mode: '0600'
  become: true
  no_log: true
  notify: relancer jadwal

# Ce que Compose lit pour interpoler, et **rien d'autre**. Aucun secret n'y entre.
#
# Compose ne se contente pas de lire le fichier qu'on lui donne : il développe les références de
# variables à l'intérieur de ses valeurs. Tant qu'on lui donnait `jadwal.env`, le « $ » du mot de
# passe SMTP lui faisait nommer deux de ses caractères dans un avertissement, à chaque appel de
# chaque tâche. Le fichier que Compose lit ne porte donc plus que l'image, le port et la taille de
# corps, et il est en 0644 : il n'y a rien à cacher dedans.
- name: Le fichier d'interpolation de Compose
  ansible.builtin.template:
    src: compose.env.j2
    dest: '{{ jadwal_etc }}/compose.env'
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: relancer jadwal

# Un fichier par conteneur, et chacun ne porte que ce que son service a besoin de savoir. Compose
# les lit en `format: raw` : ce qui est écrit ici arrive tel quel dans le conteneur, « $ » compris.
#
# `jadwal.env` ci-dessus ne disparaît pas pour autant : c'est lui que lisent les tâches de l'hôte et
# le conteneur jetable qui envoie les alertes, par `docker run --env-file`, qui n'interpole rien.
# Compose, lui, ne le lit plus du tout.
- name: Les fichiers d'environnement des conteneurs
  ansible.builtin.template:
    src: '{{ item }}.env.j2'
    dest: '{{ jadwal_etc }}/{{ item }}.env'
    owner: root
    group: root
    mode: '0600'
  # `init` porte les deux mots de passe privilégiés, `app` ne les porte plus (ADR 0040).
  loop: [app, db, init]
  become: true
  no_log: true
  notify: relancer jadwal

# Facultatif : si le paquet GHCR est public, il n'y a aucun identifiant de registre sur ce serveur.
- name: Ouverture de session sur GHCR, si le paquet est privé
  ansible.builtin.command:
    cmd: docker login ghcr.io --username {{ vault_ghcr_user }} --password-stdin
    stdin: '{{ vault_ghcr_token }}'
  become: true
  no_log: true
  changed_when: false
  when: vault_ghcr_token | default('') | length > 0

# `docker compose pull` plutôt que la collection `community.docker` : une collection de plus à
# installer, à figer et à mettre à jour pour une commande que Compose sait faire. Aucune dépendance
# sans besoin immédiat.
- name: Tirage des images, au digest demandé
  ansible.builtin.command:
    cmd: docker compose --file {{ jadwal_racine }}/compose/docker-compose.yml --env-file {{ jadwal_etc }}/compose.env pull --quiet
  become: true
  register: tirage
  changed_when: tirage.stderr | length > 0

# `up` fait tout l'ordre, et ce n'est plus ce playbook qui le tient (ADR 0040) : la base démarre,
# Compose attend qu'elle soit saine, `init` crée les rôles puis passe les migrations, Compose attend
# qu'il ait **réussi**, et l'application démarre alors seulement. Si `init` échoue, cette tâche
# échoue, et l'application qui tournait déjà continue de tourner.
#
# Les deux appels `exec -T app` qui jouaient les rôles et les migrations ont disparu d'ici : ils ne
# pourraient plus fonctionner, puisque `app.env` ne porte plus les mots de passe qu'il leur faut.
- name: Démarrage de la pile
  ansible.builtin.command:
    cmd: docker compose --file {{ jadwal_racine }}/compose/docker-compose.yml --env-file {{ jadwal_etc }}/compose.env up --detach --remove-orphans
  become: true
  register: demarrage
  changed_when: "'Started' in demarrage.stderr or 'Created' in demarrage.stderr or 'Recreated' in demarrage.stderr"

# Ce que le conteneur de démarrage a dit, pour le rapport. Il a déjà rendu la main : on relit son
# journal, on ne le relance pas.
#
# **Pas de `check_mode: false` ici**, contrairement aux lectures du rôle `caddy`. La différence tient
# en une phrase : ces deux tâches-ci lisent le **résultat** de « Démarrage de la pile », qu'un
# `--check` saute. Les forcer à tourner quand même les ferait lire un conteneur qui n'a pas été
# lancé, et l'assertion du bas échouerait sur une sortie vide — un `--check` qui s'arrête sur un faux
# négatif est pire qu'un `--check` qu'on ne joue pas.
- name: Ce que le conteneur de démarrage a fait
  ansible.builtin.command:
    cmd: docker compose --file {{ jadwal_racine }}/compose/docker-compose.yml --env-file {{ jadwal_etc }}/compose.env logs init --no-log-prefix --tail 40
  become: true
  register: journal_init
  changed_when: false

- name: Les rôles et les migrations, tels que le conteneur de démarrage les a joués
  ansible.builtin.debug:
    var: journal_init.stdout_lines
  when: journal_init.stdout_lines is defined

# `init` a rendu la main : son conteneur doit être arrêté, et arrêté **en 0**. Un conteneur de
# démarrage encore en marche voudrait dire que Compose n'a pas attendu ce qu'il devait attendre.
- name: Le conteneur de démarrage s'est bien arrêté
  ansible.builtin.command:
    cmd: docker compose --file {{ jadwal_racine }}/compose/docker-compose.yml --env-file {{ jadwal_etc }}/compose.env ps --all --format {% raw %}'{{.Service}} {{.State}} {{.ExitCode}}'{% endraw %} init
  become: true
  register: etat_init
  changed_when: false
  failed_when: etat_init.stdout is defined and etat_init.stdout | trim != 'init exited 0'

- name: Le service répond sur la boucle locale
  ansible.builtin.uri:
    url: 'http://127.0.0.1:{{ jadwal_port }}/healthz'
    status_code: 200
  register: sonde
  until: sonde.status == 200
  retries: 30
  delay: 2

- name: Ce qui tourne, pour le rapport
  ansible.builtin.debug:
    msg: 'jadwal répond sur 127.0.0.1:{{ jadwal_port }} — image {{ jadwal_image }}'
