# Le bloc de site dans le Caddy de l'hôte (ADR 0034).
#
# C'est le seul endroit où ce playbook approche un service déjà en fonctionnement sur la machine.
# Trois précautions, dans cet ordre :
#
#   1. on vérifie que le Caddyfile de l'hôte importe bien un répertoire de sites. S'il ne le fait
#      pas, on ne pose rien et on le dit : ajouter un `import` à la main dans la configuration d'un
#      Caddy en service n'est pas une modification additive ;
#   2. on pose le fichier, et on montre son contenu ;
#   3. on ne recharge **que** si `jadwal_caddy_reload=true`, c'est-à-dire seulement après que
#      l'exploitant a lu ce qu'on ajoute. Par défaut, le playbook s'arrête avant le rechargement.
---
- name: Le Caddyfile de l'hôte existe
  ansible.builtin.stat:
    path: /etc/caddy/Caddyfile
  register: caddyfile
  become: true

- name: Sans Caddyfile, on ne devine pas
  ansible.builtin.assert:
    that: caddyfile.stat.exists
    fail_msg: >-
      /etc/caddy/Caddyfile est introuvable. Ce rôle ne suppose rien de la disposition de Caddy sur
      ce serveur : relire l'inventaire, et corriger jadwal_caddy_sites, avant de rejouer.

# `check_mode: false` : cette tâche **lit** un fichier, elle ne change rien, et elle doit donc tourner
# même en mode vérification. Sans cela, Ansible saute toute tâche `command` pendant un `--check`,
# `imports.stdout` reste vide, et l'assertion suivante annonce que l'import manque alors qu'il est là.
# Un `--check --diff` qui s'arrête sur un faux négatif est pire qu'un `--check` qu'on ne joue pas.
- name: Le Caddyfile importe-t-il un répertoire de sites ?
  ansible.builtin.command: grep -E "^\s*import\s" /etc/caddy/Caddyfile
  register: imports
  changed_when: false
  failed_when: false
  check_mode: false
  become: true

- name: Sans import, on ne pose rien
  ansible.builtin.assert:
    that: jadwal_caddy_sites in imports.stdout
    fail_msg: >-
      Le Caddyfile de l'hôte n'importe pas {{ jadwal_caddy_sites }} (import relevés :
      {{ imports.stdout | default('aucun') }}). Ajouter cet import est une modification de la
      configuration d'un service en fonctionnement : elle est à l'exploitant, pas au playbook.
      La ligne à ajouter est : import {{ jadwal_caddy_sites }}/*.caddy

# La version de Caddy, **avant** de poser quoi que ce soit. Le bloc de site emploie `log_skip`, qui
# s'appelait `skip_log` avant la 2.8.0 : sur une version antérieure, Caddy ne saute pas la directive
# inconnue, il **refuse le Caddyfile entier**. Poser le fichier d'abord et découvrir ensuite, ce
# serait découvrir en ayant déjà coupé tous les sites de l'hôte.
#
# `check_mode: false` : cette tâche lit, elle ne change rien, et elle doit tourner même en
# vérification — sinon l'assertion suivante porterait sur une sortie vide.
- name: La version de Caddy
  ansible.builtin.command: caddy version
  register: caddy_version
  changed_when: false
  check_mode: false
  become: true

- name: Caddy sait garder une requête hors du journal
  ansible.builtin.assert:
    that: version_installee is version(jadwal_caddy_minimum, '>=')
    fail_msg: >-
      Caddy {{ version_installee | default(caddy_version.stdout | trim) }} est trop ancien : le bloc
      de site de jadwal emploie « log_skip », qui demande {{ jadwal_caddy_minimum }} ou plus (avant,
      la directive s'appelait « skip_log »). Une version plus ancienne refuserait le Caddyfile
      entier, donc tous les sites de cette machine. Rien n'a été écrit. Mettre Caddy à jour depuis le
      dépôt officiel de l'éditeur avant de rejouer.
  vars:
    # `caddy version` rend « v2.11.4 h1:… » chez l'éditeur et « 2.6.2 » tout court chez certaines
    # distributions : on ne lit que les trois nombres, sans supposer le « v » ni ce qui suit.
    version_installee: >-
      {{ caddy_version.stdout | regex_search('([0-9]+\.[0-9]+\.[0-9]+)', '\1') | first | default('0.0.0', true) }}

- name: Le répertoire des sites
  ansible.builtin.file:
    path: '{{ jadwal_caddy_sites }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Le bloc de site de jadwal
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../caddy/{{ jadwal_domaine }}.caddy'
    dest: '{{ jadwal_caddy_sites }}/{{ jadwal_domaine }}.caddy'
    owner: root
    group: root
    mode: '0644'
  become: true
  register: bloc
  # `--diff` montre exactement ce qui change dans la configuration d'un service partagé.
  diff: true

- name: La configuration complète est valide, jadwal compris
  ansible.builtin.command: caddy validate --config /etc/caddy/Caddyfile
  register: validation
  changed_when: false
  become: true

- name: Ce qui sera rechargé, montré avant de l'être
  ansible.builtin.debug:
    msg: >-
      Le bloc {{ jadwal_caddy_sites }}/{{ jadwal_domaine }}.caddy est posé et la configuration est
      valide. Caddy n'a PAS été rechargé. Relire le fichier, puis rejouer avec
      -e jadwal_caddy_reload=true pour que jadwal soit servi.
  when: not jadwal_caddy_reload | bool

# Le rechargement, et lui seul. `caddy reload` ne touche pas aux autres sites : c'est la seule action
# de ce playbook sur un service existant, et l'étape l'autorise nommément, à condition de l'avoir
# montrée d'abord.
#
# **Il n'est pas tout à fait gratuit, contrairement à ce qui était écrit ici.** Mesuré le 2026-09-22,
# sonde à 200 ms pendant un rechargement de 117 ms : le PID ne change pas, les écouteurs sont gardés,
# et pourtant **une requête sur cent trente-trois a été coupée** — une socket fermée, 195 ms après la
# bascule, pas un délai dépassé. Une connexion en cours d'établissement à cette demi-seconde-là peut
# y passer. C'est peu, c'est plus que zéro, et un visiteur qui tombe dessus recharge.
#
# La condition est `jadwal_caddy_reload`, et **rien d'autre**. Elle a porté `and bloc.changed`, et
# c'était un défaut qui rendait la marche à suivre impossible à suivre : le premier passage pose le
# bloc (`changed`) sans recharger, l'exploitant le relit, et le second passage le trouve inchangé —
# `bloc.changed` est alors faux, le rechargement est sauté, et jadwal n'est jamais servi. Le
# playbook l'annonçait pourtant comme fait. Trouvé à la mise en ligne, pas avant.
#
# Recharger sans que rien n'ait changé ne coûte presque rien : Caddy relit sa configuration et ne
# redémarre pas — au prix de la connexion en cours d'établissement dont il est question plus haut. Le
# drapeau est refusé par défaut : qui le pose demande un rechargement, et l'obtient.
- name: Rechargement de Caddy
  ansible.builtin.systemd_service:
    name: caddy
    state: reloaded
  become: true
  when: jadwal_caddy_reload | bool
  register: rechargement
