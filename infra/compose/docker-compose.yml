# jadwal en production (ADR 0034).
#
# Ce fichier décrit **trois** services et rien d'autre. Caddy n'y est pas : c'est celui de l'hôte,
# qui peut servir d'autres sites, et un second Caddy se disputerait les ports 80 et 443 avec lui.
#
# Deux des trois tournent en permanence — l'application et sa base. Le troisième, `init`, vit
# quelques secondes au démarrage, fait ce qui demande des droits sur la base, et s'arrête
# (ADR 0040).
#
# Ce qui est joignable de l'extérieur : rien. L'application publie son port sur la **boucle locale**
# de l'hôte, où seul Caddy va le chercher ; PostgreSQL n'écoute que sur le réseau Docker de jadwal,
# qui ne porte aucun autre service.
#
# Durcissement, ligne par ligne :
#   `read_only` — le système de fichiers du conteneur est immuable ; ce qui doit être écrit va dans
#     un `tmpfs` nommé, donc en mémoire, donc perdu au redémarrage, ce qui est exact pour du
#     temporaire ;
#   `cap_drop: [ALL]` — aucune capacité du noyau. PostgreSQL en a besoin d'une, `CHOWN`, pour poser
#     les droits de son répertoire de données au premier démarrage ;
#   `no-new-privileges` — un processus du conteneur ne peut plus gagner de droits, même par un
#     binaire `setuid` ;
#   `user` — jamais root. L'image de jadwal tourne déjà en `node` (uid 1000) ; PostgreSQL a besoin
#     de démarrer en root pour préparer son volume, et redescend ensuite sur `postgres` tout seul.
#
# Les deux images sont épinglées par digest : `JADWAL_IMAGE` est fourni par le playbook et vaut
# toujours `ghcr.io/…@sha256:…`, jamais une étiquette mouvante (ADR 0010).

name: jadwal

services:
  # Le conteneur de démarrage (ADR 0040).
  #
  # **Il existe pour que l'application n'ait plus à porter les deux mots de passe qui contournent la
  # sécurité par ligne.** Créer un rôle PostgreSQL demande le superutilisateur ; jouer une migration
  # demande le propriétaire du schéma. Ces deux pouvoirs vivaient jusqu'ici en permanence dans
  # l'environnement du conteneur exposé à Internet, alors qu'ils ne servent que quelques secondes au
  # démarrage. Qui prenait la main sur l'application les trouvait, et lisait alors toutes les
  # organisations d'un coup — ce que l'ADR 0013 et l'ADR 0019 passent leur temps à empêcher.
  #
  # Même image que l'application, parce que c'est elle qui porte `@jadwal/db`, ses migrations et ses
  # scripts. Une seconde image n'aurait rien apporté qu'un second digest à suivre.
  #
  # Il est **rejouable** : `bootstrap-roles.mjs` répare un rôle qui aurait dérivé, `migrate.mjs` ne
  # rejoue jamais une migration déjà appliquée. Le relancer n'a donc aucune conséquence visible.
  #
  # C'est aussi par lui que passent les commandes d'exploitant qui touchent à ces rôles :
  #
  #     docker compose run --rm --no-deps -T init node node_modules/@jadwal/db/scripts/super-admin.mjs --email …
  #
  # `--no-deps` n'est pas du confort. Mesuré sur Compose 5.1.4 : une base saine et en marche n'est
  # **pas** redémarrée par un `run` — Compose se contente de l'attendre. Mais dès que le fichier
  # Compose du disque ne correspond plus à l'empreinte du conteneur, `run` **recrée** la dépendance.
  # Entre le moment où le playbook copie un nouveau `docker-compose.yml` et le moment où il fait
  # `up`, une tâche périodique qui appellerait `init` sans `--no-deps` recréerait donc le conteneur
  # PostgreSQL de production, à trois heures du matin, sans que personne l'ait demandé.
  init:
    image: ${JADWAL_IMAGE:?JADWAL_IMAGE est obligatoire, et doit porter un digest sha256}
    # **Jamais `unless-stopped`.** Un conteneur qui s'arrête normalement en fin de travail serait
    # relancé sans fin par cette politique, et l'on verrait les migrations tourner en boucle.
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    # Le seul fichier qui porte encore `POSTGRES_PASSWORD` et `JADWAL_DB_OWNER_PASSWORD`. Il porte
    # aussi les mots de passe des cinq rôles applicatifs, parce que `bootstrap-roles.mjs` les pose.
    # Même `format: raw` que les autres, pour la même raison : deux lecteurs d'un même fichier
    # doivent le lire pareil.
    env_file:
      - path: /etc/jadwal/init.env
        format: raw
    environment:
      NODE_ENV: production
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
    # Les rôles d'abord, les migrations ensuite : les migrations accordent des droits à des rôles
    # qui doivent exister. `set -e` pour qu'un échec du premier n'enchaîne pas sur le second — sans
    # lui, un rôle manquant se solderait par une migration qui échoue plus loin, sur un message qui
    # ne dit pas la cause.
    command:
      - sh
      - -c
      - |
        set -e
        node node_modules/@jadwal/db/scripts/bootstrap-roles.mjs
        node node_modules/@jadwal/db/scripts/migrate.mjs
    networks: [jadwal]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  app:
    image: ${JADWAL_IMAGE:?JADWAL_IMAGE est obligatoire, et doit porter un digest sha256}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # **L'application ne démarre pas tant que `init` n'a pas réussi.** Ce n'est pas l'ordre des
      # tâches du playbook qui le garantit, c'est Compose : la propriété tient aussi quand quelqu'un
      # tape `docker compose up` à la main sur le serveur. Si `init` échoue, `up` échoue, et
      # l'application qui tournait déjà continue de tourner — un déploiement raté ne coupe rien.
      init:
        condition: service_completed_successfully
    # **`format: raw`, et ce n'est pas un détail.**
    #
    # Sans lui, Compose interpole le fichier : un `$` y ouvre une référence à une variable, une
    # référence introuvable devient une chaîne vide, et les espaces de bordure disparaissent. Le
    # conteneur reçoit alors un secret amputé — **sans erreur**, avec un avertissement noyé dans la
    # sortie — et le service échoue plus tard, ailleurs, pour une raison qui ne ressemble en rien à
    # la cause. Mesuré à la mise en ligne : un mot de passe arrivait tronqué, et aucun courriel ne
    # pouvait partir.
    #
    # `format: raw` fait lire le fichier à Compose comme `docker run --env-file` le lit, et c'est
    # ce qu'il faut : le même fichier a deux lecteurs, ils doivent le lire pareil. Il demande
    # Compose 2.30.0 ou plus. `pnpm env:test` le vérifie dans des conteneurs jetables, et tombe
    # quand on l'enlève.
    #
    # Chaque service a **son** fichier, écrit par le playbook : un conteneur ne reçoit que ce qui le
    # concerne. L'application n'a pas à voir les adresses de battement de cœur, la base n'a pas à
    # voir le secret de session.
    #
    # Ce fichier-ci ne porte **ni `POSTGRES_PASSWORD`, ni `JADWAL_DB_OWNER_PASSWORD`** depuis
    # l'ADR 0040 : ils sont partis dans `init.env`. L'application n'en a jamais eu besoin — elle
    # n'ouvre de connexion que sous `app`, `superadmin`, `auth` et `public` —, et
    # `apps/web/tests/roles-de-base.test.ts` tombe si un jour elle en demande un autre.
    env_file:
      - path: /etc/jadwal/app.env
        format: raw
    environment:
      # Ce qui n'est **pas** un secret reste ici : rien de ce qui suit ne peut être abîmé par
      # l'interpolation, et le lire dans ce fichier vaut mieux que d'aller le chercher ailleurs.
      NODE_ENV: production
      # adapter-node écoute sur toutes les interfaces **du conteneur** ; c'est la publication de
      # port ci-dessous qui décide de ce que l'hôte expose.
      HOST: 0.0.0.0
      PORT: '3000'
      # L'adresse réelle du visiteur : la dernière valeur de X-Forwarded-For, celle que Caddy vient
      # d'ajouter. `XFF_DEPTH=1` parce qu'il y a exactement un mandataire devant nous.
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: '1'
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-512K}

      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      MAIL_TRANSPORT: smtp
    ports:
      # **La boucle locale, et elle seule.** Sans `127.0.0.1:`, Docker ouvrirait le port sur toutes
      # les interfaces et court-circuiterait le pare-feu de l'hôte, qui ne voit pas les règles que
      # Docker écrit lui-même dans nftables.
      - '127.0.0.1:${JADWAL_APP_PORT:-3080}:3000'
    networks: [jadwal]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # `node` plutôt que `curl` : l'image ne contient ni curl ni wget, et en ajouter un pour une
      # sonde reviendrait à agrandir la surface pour la commodité.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  db:
    # PostgreSQL 18.6, même digest que docker-compose.dev.yml et que la CI : la version qui tourne
    # en production est celle contre laquelle les tests ont tourné.
    image: postgres:18.6@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    restart: unless-stopped
    # Lu tel quel, pour la même raison que celui de l'application. Ce fichier-ci ne porte que les
    # quatre variables de PostgreSQL : la base n'a rien à savoir du reste.
    env_file:
      - path: /etc/jadwal/db.env
        format: raw
    # **Aucun port publié.** La base n'est joignable que depuis le réseau `jadwal`, c'est-à-dire
    # depuis l'application et depuis les tâches qui s'y rattachent le temps d'une commande.
    networks: [jadwal]
    volumes:
      - pgdata:/var/lib/postgresql
    cap_drop: [ALL]
    cap_add:
      # La seule dont l'image ait besoin : elle pose les droits de son répertoire de données au
      # premier démarrage, puis abandonne root.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

networks:
  jadwal:
    # Un réseau à nous, que le playbook crée et que rien d'autre ne rejoint. jadwal n'entre dans
    # aucun réseau qui ne soit à lui, et n'ouvre le sien à personne (ADR 0034).
    name: jadwal

volumes:
  pgdata:
    # **Ne jouez pas ce fichier tel quel sur un poste de développement.** `docker-compose.dev.yml`,
    # à la racine du dépôt, produit un volume qui porte **exactement** ce nom : son projet s'appelle
    # `jadwal` et son volume `pgdata`. Compose ne refuse pas — il avertit et attache le volume
    # existant, et l'on se retrouve avec deux serveurs PostgreSQL sur le même répertoire de données.
    #
    # Mesuré le 2026-09-22, en répétant le déploiement sur un poste : les deux ont tourné vingt-huit
    # secondes côte à côte, le second a réécrit `postmaster.pid`, et en s'arrêtant il l'a effacé — ce
    # que le premier a fini par remarquer : « performing immediate shutdown because data directory
    # lock file is invalid ». Rien n'a été perdu ici, et ce n'était pas garanti.
    #
    # Pour répéter en local : un fichier de surcharge qui renomme ce volume, et un nom de projet à
    # part (`-p`).
    name: jadwal_pgdata
