name: Supervision

# La sonde extérieure : est-ce que jadwal répond, vu d'ailleurs que de son propre serveur ?
#
# La veille qui tourne sur le serveur (`jadwal-veille.timer`) sait tout sauf une chose : si le
# serveur est injoignable, elle est injoignable avec lui. Il faut donc quelqu'un dehors. GitHub
# Actions le fait sans rien coûter de plus et sans service tiers à payer (ADR 0036).
#
# Ce que cette sonde ne peut pas faire, et il faut le dire plutôt que de le laisser croire : les
# machines de GitHub n'ont **pas** d'IPv6 sortant. Un `curl -6` y échoue toujours, quelle que soit
# la configuration du serveur. L'IPv6 est donc vérifié par la veille, depuis le serveur, contre sa
# propre adresse publique, et par l'exploitant à la mise en production. Écrire ici un test IPv6 qui
# échoue toujours reviendrait à apprendre à tout le monde à ignorer cette sonde.
#
# Les exécutions programmées de GitHub sont « au mieux » : un retard de quelques minutes est normal,
# et ne veut pas dire que le service est tombé. C'est pourquoi l'alerte demande deux échecs
# consécutifs à trente secondes d'intervalle.

on:
  schedule:
    # Toutes les quinze minutes. Plus souvent serait étranglé par GitHub sans rien apprendre de plus.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supervision
  cancel-in-progress: false

jobs:
  healthz:
    name: /healthz depuis l'extérieur
    # L'interrupteur. Tant que le service n'est pas en production, cette sonde échouerait toutes les
    # quinze minutes contre un nom qui ne répond pas encore, et apprendrait à l'exploitant à ignorer
    # ses courriels avant même la mise en ligne. La variable de dépôt `SUPERVISION_ACTIVE` l'arme :
    #   gh variable set SUPERVISION_ACTIVE --body true
    # Sans elle, l'exécution est « ignorée », pas rouge.
    if: vars.SUPERVISION_ACTIVE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Interroger https://jadwal.voltia.ch/healthz
        id: sonde
        run: |
          set -u
          url="https://jadwal.voltia.ch/healthz"
          for essai in 1 2; do
            code="$(curl --silent --show-error --location --max-time 20 \
              --output /tmp/reponse.txt --write-out '%{http_code}' "$url" || echo 000)"
            if [ "$code" = "200" ]; then
              echo "essai $essai : $code"
              echo "etat=ok" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "essai $essai : $code"
            [ "$essai" = "1" ] && sleep 30
          done
          {
            echo "etat=echec"
            echo "code=$code"
          } >> "$GITHUB_OUTPUT"
          exit 1

      # `if: failure()` : l'étape ne tourne que si la sonde a vraiment échoué deux fois.
      #
      # Le courriel part par `curl`, qui parle SMTP depuis toujours et se trouve sur toutes les
      # machines de GitHub. Une action tierce du Marketplace ferait dépendre l'alerte d'un dépôt que
      # nous ne contrôlons pas, pour envoyer six lignes de texte.
      #
      # Si les secrets ne sont pas posés, l'étape ne fait rien et l'exécution reste rouge : GitHub
      # prévient alors le propriétaire du dépôt par son propre canal, ce qui est le filet de secours.
      - name: Prévenir l'exploitant
        if: failure()
        env:
          # Le serveur d'envoi n'est pas écrit dans le dépôt : il vient de la variable de dépôt
          # `SUPERVISION_SMTP_URL`, que chaque instance pose chez elle avec son propre fournisseur :
          #   gh variable set SUPERVISION_SMTP_URL --body 'smtp://smtp.exemple.tld:587'
          # La valeur de repli n'est qu'un exemple : elle ne mène nulle part, et l'envoi échoue alors
          # bruyamment plutôt que d'aller frapper à une porte au hasard.
          SMTP_URL: ${{ vars.SUPERVISION_SMTP_URL || 'smtp://smtp.exemple.tld:587' }}
          SMTP_USER: ${{ secrets.SUPERVISION_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SUPERVISION_SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.SUPERVISION_MAIL_TO }}
        run: |
          set -u
          if [ -z "${SMTP_USER:-}" ] || [ -z "${SMTP_PASSWORD:-}" ] || [ -z "${MAIL_TO:-}" ]; then
            echo "Secrets de supervision absents : pas de courriel." >&2
            echo "GitHub préviendra le propriétaire du dépôt de l'échec de cette exécution." >&2
            exit 0
          fi
          {
            printf 'From: jadwal <%s>\n' "$SMTP_USER"
            printf 'To: %s\n' "$MAIL_TO"
            printf 'Reply-To: contact@voltia.ch\n'
            printf 'Subject: jadwal : le service ne repond plus\n'
            printf 'Content-Type: text/plain; charset=utf-8\n'
            printf '\n'
            printf 'https://jadwal.voltia.ch/healthz n a pas rendu 200, deux fois de suite.\n\n'
            printf 'Derniere reponse : %s\n' "${{ steps.sonde.outputs.code }}"
            printf 'Execution : %s/%s/actions/runs/%s\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'La marche a suivre est dans docs/EXPLOITATION.md.\n'
            printf '\n-- \njadwal, un service de Voltia\n'
          } > /tmp/message.txt
          curl --silent --show-error --ssl-reqd \
            --url "$SMTP_URL" \
            --user "$SMTP_USER:$SMTP_PASSWORD" \
            --mail-from "$SMTP_USER" \
            --mail-rcpt "$MAIL_TO" \
            --upload-file /tmp/message.txt
          echo "Alerte envoyée à $MAIL_TO."
