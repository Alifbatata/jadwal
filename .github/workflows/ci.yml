name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Le contrôle de secrets passe avant tout le reste, et l'image ne part pas sans lui.
  # Il double, côté dépôt, ce que le crochet `pre-commit` fait côté poste : un crochet local
  # se contourne d'un `--no-verify`, pas une étape de CI.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tout l'historique, pas seulement la dernière version des fichiers : un secret retiré
          # au commit suivant reste un secret publié.
          fetch-depth: 0
          persist-credentials: false

      # gitleaks est épinglé par version ET par empreinte. Pas d'action tierce ici : une action
      # de plus, c'est une dépendance de plus à qui l'on confie le dépôt (ADR 0010). La version
      # et l'empreinte sont les mêmes que dans scripts/installer-hooks.mjs — les relever ensemble.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors -o "/tmp/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          test "$(gitleaks version)" = "${GITLEAKS_VERSION}"

      # `--redact` : un secret trouvé ne doit pas être recopié dans un journal d'exécution, qui
      # est public et que la réécriture d'historique n'atteint pas.
      - name: Scan the whole history
        run: gitleaks git --no-banner --redact --exit-code 1 .

  ci:
    name: Lint, check, test, build
    runs-on: ubuntu-latest
    # Seule borne de l'attente de santé du service : le runner boucle tant que Docker répond
    # « starting ».
    timeout-minutes: 15

    env:
      # Base jetable, détruite avec le runner. Les tests créent et suppriment leur propre base.
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_USER: jadwal
      POSTGRES_PASSWORD: jadwal-ci
      POSTGRES_DB: jadwal
      # Le propriétaire des tables n'est ni superutilisateur ni porteur de BYPASSRLS : les
      # migrations tournent sous lui, et la CI vérifie qu'aucun objet n'appartient à un autre rôle.
      JADWAL_DB_OWNER_PASSWORD: jadwal-ci-owner
      JADWAL_DB_APP_PASSWORD: jadwal-ci-app
      JADWAL_DB_SUPERADMIN_PASSWORD: jadwal-ci-superadmin
      JADWAL_DB_AUTH_PASSWORD: jadwal-ci-auth
      JADWAL_DB_PUBLIC_PASSWORD: jadwal-ci-public
      # Les tests d'accès lancent un vrai serveur : il lui faut une origine et un secret.
      ORIGIN: http://127.0.0.1:4173
      BETTER_AUTH_SECRET: secret-de-ci-assez-long-pour-ne-pas-etre-refuse
      MAIL_TRANSPORT: file

    services:
      db:
        # Même image et même digest que docker-compose.dev.yml. Le contexte « env » n'est pas
        # disponible ici : les valeurs sont écrites en littéral.
        image: postgres:18.6@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
        env:
          POSTGRES_USER: jadwal
          POSTGRES_PASSWORD: jadwal-ci
          POSTGRES_DB: jadwal
        ports:
          - 5432:5432
        # L'image officielle ne définit aucun test de santé : sans celui-ci, le runner la
        # considérerait prête immédiatement. « -h 127.0.0.1 » force le TCP, car le serveur
        # temporaire d'initialisation n'écoute que sur la socket Unix.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U jadwal -d jadwal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Corepack n'est plus distribué avec Node à partir de la v25. pnpm/setup est l'action officielle
      # recommandée par https://pnpm.io/continuous-integration : elle installe l'exécutable pnpm à la
      # version du champ packageManager de package.json (téléchargement vérifié par la signature du
      # registre npm), met en cache le store pnpm (clé = empreinte de pnpm-lock.yaml) et laisse ici
      # l'installation à l'étape explicite ci-dessous.
      - name: Set up pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: false

      # La version de Node vient de .node-version (source unique).
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Construire d'abord : @jadwal/db consomme les types publiés de @jadwal/core, qui n'existent
      # qu'une fois le paquet construit. pnpm -r suit l'ordre des dépendances.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test

      # La suite de @jadwal/core doit donner le même résultat quel que soit le fuseau de la machine.
      - name: Test core under four time zones
        run: pnpm test:tz

  image:
    name: Build and publish the production image
    # L'image n'est construite que si la chaîne complète est verte : rien ne part sur le registre
    # avant que toute la suite ait passé — sans un seul test sauté, `pnpm test` y veille — et que le
    # contrôle de secrets soit passé lui aussi.
    needs: [ci, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Le seul droit d'écriture de toute la CI, et il ne porte que sur le registre d'images.
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Un dépôt GitHub peut porter des majuscules, un nom d'image de registre non — `buildx` refuse
      # net : « repository name must be lowercase ». `github.repository` ne peut pas être mis en
      # minuscules dans une expression de workflow, d'où cette étape.
      - name: Le nom de l'image, en minuscules
        run: echo "JADWAL_IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # Coupés : l'attestation de provenance publiait le message de commit dans le registre public.
          provenance: false
          sbom: false
          # Deux étiquettes pour retrouver l'image humainement, mais ce n'est **jamais** par une
          # étiquette qu'on déploie : le playbook exige un digest (ADR 0010).
          tags: |
            ${{ env.JADWAL_IMAGE_NAME }}:main
            ${{ env.JADWAL_IMAGE_NAME }}:${{ github.sha }}
          # Le cache du registre : une construction qui ne change que le code applicatif ne
          # réinstalle pas les dépendances.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Le digest est ce qui compte. Il est écrit dans le résumé de l'exécution, avec la commande à
      # copier telle quelle : c'est elle qui déploie, et elle ne contient aucune étiquette mouvante.
      - name: What to deploy
        run: |
          {
            echo "## Image publiée"
            echo
            echo '```'
            echo "${{ env.JADWAL_IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "Déployer :"
            echo
            echo '```'
            echo "cd infra/ansible"
            echo "ansible-playbook jadwal.yml -e jadwal_image=${{ env.JADWAL_IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
